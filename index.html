<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>짤·카드 스튜디오 - Studio UI</title>
<style>
  :root { --bg-light: #f0f2f5; --panel-bg: #fff; --text-dark: #333; --border-color: #e0e0e0; --accent: #E1002A; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-light); color: var(--text-dark); font-family: 'Pretendard', sans-serif; }
  .center-panel, .canvas-wrapper, .upload-label, .insta-profile, .insta-main, .modal-overlay.show { display: flex; justify-content: center; align-items: center; }

  /* 상단 바 */
  .top-bar { height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; background: #fff; border-bottom: 1px solid var(--border-color); box-shadow: 0 2px 4px rgba(0,0,0,.02); }
  .top-bar h1 { margin: 0; font-size: 1.5rem; font-weight: 800; color: #111; }
  .top-actions { display: flex; gap: 10px; }
  .btn-outline, .btn-complete { padding: 8px 20px; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: .2s; }
  .btn-outline { background: #fff; color: #333; border: 1px solid #ccc; }
  .btn-outline:hover { background: #f0f0f0; }
  .btn-complete { background: var(--accent); color: #fff; border: none; }
  .btn-complete:hover { filter: brightness(1.1); }

  /* 중앙: 툴바 · 캔버스 · 되돌리기 */
  .main-container { display: flex; flex: 1; overflow: hidden; }
  .center-panel { flex: 1; padding: 20px; background: #e9ecef; flex-direction: column; }
  .canvas-toolbar { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 600px; margin-bottom: 10px; }
  .canvas-toolbar > div { display: flex; gap: 8px; }
  .icon-btn, .ratio-select { background: #fff; border: 1px solid #ccc; border-radius: 6px; font-size: .9rem; font-weight: bold; color: #333; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .icon-btn { padding: 8px 14px; display: flex; align-items: center; gap: 5px; transition: .2s; }
  .icon-btn[hidden] { display: none; }
  .icon-btn:hover { background: #f0f0f0; }
  .ratio-select { padding: 8px; }
  #btnDeleteImg { color: #d32f2f; }

  .canvas-wrapper { position: relative; width: 100%; max-width: 600px; aspect-ratio: 1 / 1; background: #fff; border: 2px dashed #b0b0b0; border-radius: 12px; overflow: hidden; transition: .3s; box-shadow: 0 4px 12px rgba(0,0,0,.05); }
  .canvas-wrapper.drag-over { border-color: var(--accent); background: rgba(225,0,42,.05); }
  .upload-label { position: absolute; inset: 0; cursor: pointer; z-index: 5; }
  .upload-guide { text-align: center; color: #999; pointer-events: none; }
  .upload-guide svg { width: 50px; height: 50px; margin-bottom: 10px; fill: #ccc; }
  #bgCanvas, #drawCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #bgCanvas { z-index: 1; }
  #drawCanvas { z-index: 2; cursor: default; }
  .canvas-wrapper.drawing #drawCanvas { cursor: crosshair; }

  .text-layer { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; padding: 5px; z-index: 10; color: #fff; font-size: 40px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,.8); white-space: nowrap; cursor: move; user-select: none; pointer-events: auto; }
  .text-layer.selected { outline: 2px dashed #333; }
  .rotate-handle { display: none; position: absolute; top: -34px; left: 50%; transform: translateX(-50%); width: 22px; height: 22px; justify-content: center; align-items: center; background: #fff; border: 2px solid var(--accent); border-radius: 50%; color: var(--accent); font-size: 14px; line-height: 1; text-shadow: none; box-shadow: 0 1px 4px rgba(0,0,0,.3); cursor: grab; }
  .rotate-handle::after { content: ''; position: absolute; top: 100%; left: 50%; width: 2px; height: 10px; margin-left: -1px; background: var(--accent); }
  .text-layer.selected .rotate-handle { display: flex; }

  .canvas-bottom-bar { display: flex; gap: 8px; margin-top: 15px; width: 100%; max-width: 600px; }
  .history-btn { padding: 8px 15px; display: flex; align-items: center; justify-content: center; background: #fff; border: 2px solid var(--accent); border-radius: 6px; font-size: 1.1rem; font-weight: bold; color: var(--accent); cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,.1); transition: .2s; }
  .history-btn:disabled { opacity: .5; cursor: not-allowed; border-color: #ccc; color: #ccc; box-shadow: none; }
  .history-btn:hover:not(:disabled) { background: #fff0f2; transform: translateY(-2px); }

  /* 오른쪽 패널 */
  .right-panel { width: 280px; display: flex; flex-direction: column; overflow-y: auto; background: var(--panel-bg); border-left: 1px solid var(--border-color); }
  .color-section { padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; background: #f9f9f9; border-bottom: 2px solid var(--border-color); }
  .color-section .title { align-self: flex-start; display: flex; align-items: center; gap: 8px; font-size: .9rem; font-weight: bold; color: #555; }
  .swatch { width: 18px; height: 18px; border-radius: 4px; border: 2px solid #ccc; background: #f00; }
  .color-wheel-container { position: relative; width: 140px; height: 140px; border-radius: 50%; background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); cursor: crosshair; box-shadow: 0 0 10px rgba(0,0,0,.1); }
  .color-wheel-container::after { content: ''; position: absolute; top: 50%; left: 50%; width: 70px; height: 70px; transform: translate(-50%, -50%); border-radius: 50%; background: #f9f9f9; box-shadow: inset 0 0 5px rgba(0,0,0,.3), 0 0 0 2px #fff; pointer-events: none; }
  #lightnessInput { -webkit-appearance: none; appearance: none; width: 100%; height: 12px; margin: 0; border-radius: 6px; outline: none; cursor: pointer; }
  #lightnessInput::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 2px solid #888; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  #lightnessInput::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 2px solid #888; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .history-title { width: 100%; margin-top: 5px; font-size: .8rem; color: #888; }
  .history-palette { width: 100%; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .history-palette div { aspect-ratio: 1; border-radius: 50%; border: 1px solid #ddd; cursor: pointer; transition: transform .1s; }
  .history-palette div:hover { transform: scale(1.1); }

  /* 아코디언 도구 */
  .accordion { border-bottom: 1px solid var(--border-color); }
  .accordion-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: #fff; color: #333; font-weight: bold; cursor: pointer; user-select: none; }
  .accordion-header:hover { background: #f0f0f0; }
  .arrow { font-size: .8rem; color: #888; transition: transform .2s; }
  .accordion.open .arrow { transform: rotate(180deg); }
  .accordion-content { max-height: 0; padding: 0 15px; overflow: hidden; background: #fafafa; transition: max-height .3s ease-out; }
  .accordion.open .accordion-content { max-height: 500px; padding: 15px; overflow-y: auto; }
  .tool-btn { width: 100%; padding: 10px; margin-bottom: 10px; background: #f0f0f0; color: #333; border: 1px solid #ddd; border-radius: 6px; text-align: left; cursor: pointer; transition: .2s; }
  .tool-btn:hover { background: #e0e0e0; }
  .tool-btn.active, .tool-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tool-btn.primary { text-align: center; }
  .brush-label { margin-bottom: 5px; font-size: .85rem; color: #666; }
  .brush-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
  .font-grid { grid-template-columns: repeat(4, 1fr); margin-bottom: 0; }
  .brush-item { padding: 8px; font-size: .8rem; text-align: center; background: #fff; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; }
  .brush-item.active { background: #333; color: #fff; border-color: #333; }
  .brush-size-control { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; font-size: .85rem; color: #555; }
  .brush-size-control input { flex: 1; }
  .emoji-row { display: flex; gap: 10px; flex-wrap: wrap; font-size: 1.5rem; }
  .emoji-row span { cursor: pointer; }
  .input-group { margin-bottom: 15px; }
  .input-group label { display: block; margin-bottom: 5px; font-size: .9rem; color: #666; }
  .input-group input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; background: #fff; color: #333; border: 1px solid #ccc; border-radius: 4px; }
  .input-group input[type="range"] { width: 100%; }

  /* 인스타 피드 모달 */
  .modal-overlay { position: fixed; inset: 0; display: none; z-index: 1000; background: rgba(0,0,0,.6); backdrop-filter: blur(3px); }
  .insta-modal { width: 400px; display: flex; flex-direction: column; background: #fff; color: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.3); animation: slideUp .3s ease-out; }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .insta-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #eee; }
  .insta-profile { width: 36px; height: 36px; border-radius: 50%; background: #ddd; font-size: 1.2rem; }
  .insta-nick { font-weight: bold; font-size: .95rem; }
  .insta-main { width: 100%; aspect-ratio: 1 / 1; background: #000; overflow: hidden; }
  .insta-main img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .insta-footer { padding: 12px 16px; }
  .insta-actions { display: flex; gap: 15px; margin-bottom: 8px; font-size: 1.5rem; }
  .insta-info { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 8px; }
  .insta-caption { font-size: .9rem; line-height: 1.4; }
  .insta-caption span { color: #00376b; }
  .btn-insta-download { padding: 8px 12px; display: flex; align-items: center; gap: 5px; background: #00376b; color: #fff; border: none; border-radius: 6px; font-size: .85rem; font-weight: bold; cursor: pointer; }
  .close-modal { position: absolute; top: 20px; right: 20px; background: none; border: none; color: #fff; font-size: 2rem; cursor: pointer; }
</style>
</head>
<body>

  <div class="top-bar">
    <h1>Card Studio</h1>
    <div class="top-actions">
      <button class="btn-outline" id="btnDirectDownload">바로 다운로드💾</button>
      <button class="btn-complete" id="btnComplete">업로드하기</button>
    </div>
  </div>

  <div class="main-container">
    <div class="center-panel">
      <div class="canvas-toolbar">
        <div>
          <button class="icon-btn" id="btnUploadIcon" title="사진 가져오기">📁 사진</button>
          <select class="ratio-select" id="ratioSelect">
            <option value="1/1">1:1</option>
            <option value="4/5">4:5</option>
            <option value="9/16">9:16</option>
          </select>
        </div>
        <div><button class="icon-btn" id="btnDeleteImg" hidden>❌ 사진삭제</button></div>
      </div>

      <div class="canvas-wrapper" id="canvasWrapper">
        <label class="upload-label" for="fileInput" id="uploadLabel">
          <div class="upload-guide">
            <svg viewBox="0 0 24 24"><path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" /></svg>
            <p>이미지를 드래그하거나<br>클릭해서 불러오세요.</p>
          </div>
        </label>
        <input type="file" id="fileInput" accept="image/png, image/jpeg" hidden>
        <canvas id="bgCanvas" width="600" height="600"></canvas>
        <canvas id="drawCanvas" width="600" height="600"></canvas>
        <div class="text-layer" id="textLayer">
          <span id="textBody">텍스트를 입력하세요</span>
          <div class="rotate-handle" id="rotateHandle" title="드래그해서 회전">↻</div>
        </div>
      </div>

      <div class="canvas-bottom-bar">
        <button class="history-btn" id="btnUndo" title="실행 취소" aria-label="실행 취소" disabled>⏪</button>
        <button class="history-btn" id="btnRedo" title="다시 실행" aria-label="다시 실행" disabled>⏩</button>
      </div>
    </div>

    <div class="right-panel">
      <div class="color-section">
        <div class="title">색상 <span class="swatch" id="currentColor"></span></div>
        <div class="color-wheel-container" id="colorWheel"></div>
        <div class="history-title">밝기</div>
        <input type="range" id="lightnessInput" min="0" max="100" value="50">
        <div class="history-title">사용기록</div>
        <div class="history-palette" id="historyPalette"></div>
      </div>

      <div class="accordion">
        <div class="accordion-header"><span>🖊️ 펜 (그리기)</span><span class="arrow">▼</span></div>
        <div class="accordion-content">
          <button class="tool-btn" id="btnDrawMode">🖊️ 그리기 모드 켜기/끄기</button>
          <div class="brush-label">브러시 종류</div>
          <div class="brush-grid">
            <div class="brush-item active" data-brush="pen">볼펜</div>
            <div class="brush-item" data-brush="pencil">연필</div>
            <div class="brush-item" data-brush="neon">네온사인</div>
            <div class="brush-item" data-brush="heart">하트</div>
            <div class="brush-item" data-brush="star">별</div>
          </div>
          <div class="brush-size-control"><span>두께</span><input type="range" id="brushSizeInput" min="1" max="30" value="4"><span id="brushSizeValue">4</span></div>
        </div>
      </div>

      <div class="accordion">
        <div class="accordion-header"><span>🧽 지우개</span><span class="arrow">▼</span></div>
        <div class="accordion-content">
          <button class="tool-btn" id="btnEraserMode">🧽 지우개 모드 켜기/끄기</button>
          <div class="brush-size-control"><span>지우개 두께</span><input type="range" id="eraserSizeInput" min="5" max="50" value="20"><span id="eraserSizeValue">20</span></div>
        </div>
      </div>

      <div class="accordion">
        <div class="accordion-header"><span>😊 이모지</span><span class="arrow">▼</span></div>
        <div class="accordion-content">
          <div class="emoji-row">
            <span data-soon="이모지 기능 준비 중!">😈</span><span data-soon="이모지 기능 준비 중!">🤺</span>
            <span data-soon="이모지 기능 준비 중!">🔥</span><span data-soon="이모지 기능 준비 중!">💖</span>
          </div>
        </div>
      </div>

      <div class="accordion open">
        <div class="accordion-header"><span>🔤 텍스트 추가</span><span class="arrow">▼</span></div>
        <div class="accordion-content">
          <div class="input-group"><label>내용</label><input type="text" id="textInput" placeholder="문구 입력" value="텍스트를 입력하세요"></div>
          <div class="input-group"><label>크기</label><input type="range" id="sizeInput" min="10" max="100" value="40"></div>
          <div class="input-group">
            <label>글꼴</label>
            <div class="brush-grid font-grid">
              <div class="brush-item font-item active" data-font="gothic">고딕</div>
              <div class="brush-item font-item" data-font="myeongjo">명조</div>
              <div class="brush-item font-item" data-font="gulim">굴림</div>
              <div class="brush-item font-item" data-font="gungsuh">궁서</div>
            </div>
          </div>
          <button class="tool-btn primary" id="btnAddText">텍스트 얹기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 인스타 피드 모달 -->
  <div class="modal-overlay" id="modal">
    <button class="close-modal" id="btnCloseModal">×</button>
    <div class="insta-modal">
      <div class="insta-header"><div class="insta-profile">🦋</div><div class="insta-nick">ALEPH_Studio</div></div>
      <div class="insta-main"><img id="instaResultImg" alt="완성된 짤"></div>
      <div class="insta-footer">
        <div class="insta-actions">❤️ 💬 ✈️</div>
        <div class="insta-info">
          <div class="insta-caption"><b>ALEPH_Studio</b> 제가 만들었어요!<br><span>#SKTagram #CardStudio</span></div>
          <button class="btn-insta-download" id="btnModalDownload">💾 다운로드</button>
        </div>
      </div>
    </div>
  </div>

<script>
  const $ = id => document.getElementById(id);
  const [wrap, bgCanvas, drawCanvas, label, text, textBody, handle, curColor, historyEl, fileInput, wheel, lightInput,
         textInput, sizeInput, modal, resultImg, ratioSelect, btnDelete, btnUndo, btnRedo, brushSizeInput, eraserSizeInput] =
    ['canvasWrapper', 'bgCanvas', 'drawCanvas', 'uploadLabel', 'textLayer', 'textBody', 'rotateHandle', 'currentColor', 'historyPalette',
     'fileInput', 'colorWheel', 'lightnessInput', 'textInput', 'sizeInput', 'modal', 'instaResultImg', 'ratioSelect', 'btnDeleteImg',
     'btnUndo', 'btnRedo', 'brushSizeInput', 'eraserSizeInput'].map($);
  const bgCtx = bgCanvas.getContext('2d'), ctx = drawCanvas.getContext('2d');
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const TAU = Math.PI * 2;
  const MAX_WIDTH = { '1/1': 600, '4/5': 480, '9/16': 340 };
  const MAX_HISTORY = 20;
  const FONTS = {
    gothic: "'Pretendard', 'Malgun Gothic', 'Noto Sans KR', sans-serif",
    myeongjo: "'Batang', '바탕', 'Noto Serif KR', 'AppleMyungjo', serif",
    gulim: "'Gulim', '굴림', 'Dotum', '돋움', 'Noto Sans KR', sans-serif",
    gungsuh: "'Gungsuh', '궁서', 'GungsuhChe', 'Noto Serif KR', serif",
  };

  let hue = 0, lightness = 50, color;
  let recent = ['#FFFFFF', '#000000', '#E1002A', '#004488', '#FF7A00'];
  let drag = null, grab = null, selected = false;
  const T = { shown: false, content: '텍스트를 입력하세요', size: 40, color: null, x: 50, y: 50, rot: 0, font: 'gothic' };

  let mode = null, brushType = 'pen', brushSize = 4, eraserSize = 20;
  let isDrawing = false, lastX = 0, lastY = 0, stampX = 0, stampY = 0;
  let baseImage = null, drawingReference = null, restoreToken = 0;
  let canvasHistory = [], historyStep = -1;

  document.querySelectorAll('.accordion-header').forEach(h => h.onclick = () => h.parentElement.classList.toggle('open'));
  document.querySelectorAll('[data-soon]').forEach(el => el.onclick = () => alert(el.dataset.soon));

  /* ── 텍스트 ── */
  function renderText(w = wrap.clientWidth) {
    textBody.textContent = T.content;
    Object.assign(text.style, {
      display: T.shown ? 'block' : 'none', left: T.x + '%', top: T.y + '%', color: T.color,
      fontFamily: FONTS[T.font], fontSize: T.size * w / 600 + 'px', transform: `translate(-50%, -50%) rotate(${T.rot}deg)`,
    });
    text.classList.toggle('selected', selected && T.shown);
    document.querySelectorAll('.font-item').forEach(b => b.classList.toggle('active', b.dataset.font === T.font));
  }

  /* ── 캔버스 / 실행 취소 ── */
  const cloneCanvas = src => { const c = Object.assign(document.createElement('canvas'), { width: src.width, height: src.height }); c.getContext('2d').drawImage(src, 0, 0); return c; };
  const fitBox = (sw, sh, dw, dh) => { const s = Math.min(dw / sw, dh / sh); return [(dw - sw * s) / 2, (dh - sh * s) / 2, sw * s, sh * s]; };
  const resizeCanvases = (w, h) => { bgCanvas.width = drawCanvas.width = w; bgCanvas.height = drawCanvas.height = h; };
  const setRatio = v => { wrap.style.aspectRatio = v; wrap.style.maxWidth = MAX_WIDTH[v] + 'px'; };

  function renderBackground() {
    bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
    if (baseImage) bgCtx.drawImage(baseImage, ...fitBox(baseImage.width, baseImage.height, bgCanvas.width, bgCanvas.height));
  }

  function saveHistory(updateRef = false) {
    canvasHistory = canvasHistory.slice(0, historyStep + 1);
    canvasHistory.push({ drawData: drawCanvas.toDataURL('image/png'), width: drawCanvas.width, height: drawCanvas.height, ratio: ratioSelect.value, text: { ...T } });
    if (canvasHistory.length > MAX_HISTORY) canvasHistory.shift();
    historyStep = canvasHistory.length - 1;
    if (updateRef || !drawingReference) drawingReference = cloneCanvas(drawCanvas);
    updateHistoryButtons();
  }
  function updateHistoryButtons() {
    btnUndo.disabled = historyStep <= 0;
    btnRedo.disabled = historyStep >= canvasHistory.length - 1;
  }

  function restoreCanvas(s) {
    const token = ++restoreToken;
    ratioSelect.value = s.ratio;
    setRatio(s.ratio);
    resizeCanvases(s.width, s.height);
    renderBackground();
    Object.assign(T, s.text);
    textInput.value = T.content;
    sizeInput.value = T.size;
    renderText(s.width);

    const im = new Image();
    im.onload = im.onerror = () => {
      if (token !== restoreToken) return;
      ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      if (im.naturalWidth) ctx.drawImage(im, 0, 0, drawCanvas.width, drawCanvas.height);
      drawingReference = cloneCanvas(drawCanvas);
    };
    im.src = s.drawData;
  }
  const moveHistory = d => {
    const n = historyStep + d;
    if (n < 0 || n >= canvasHistory.length) return;
    historyStep = n;
    restoreCanvas(canvasHistory[n]);
    updateHistoryButtons();
  };
  btnUndo.onclick = () => moveHistory(-1);
  btnRedo.onclick = () => moveHistory(1);

  function initCanvas() {
    restoreToken++;
    renderBackground();
    ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    canvasHistory = [];
    historyStep = -1;
    drawingReference = null;
    saveHistory(true);
  }

  /* ── 사진 불러오기 ── */
  function showPhoto(on) {
    label.style.display = on ? 'none' : 'flex';
    btnDelete.hidden = !on;
  }
  function handleFile(file) {
    if (!file) return;
    if (!['image/png', 'image/jpeg'].includes(file.type)) {
      alert('지원하지 않는 파일 형식입니다. PNG 또는 JPEG 파일만 사용 가능합니다.');
      fileInput.value = '';
      return;
    }
    const im = new Image();
    im.onload = () => { URL.revokeObjectURL(im.src); baseImage = im; initCanvas(); showPhoto(true); fileInput.value = ''; };
    im.onerror = () => { alert('이미지를 불러오지 못했습니다.'); fileInput.value = ''; };
    im.src = URL.createObjectURL(file);
  }
  $('btnUploadIcon').onclick = () => fileInput.click();
  btnDelete.onclick = () => { baseImage = null; initCanvas(); showPhoto(false); };
  fileInput.onchange = e => handleFile(e.target.files[0]);
  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(type => wrap.addEventListener(type, e => {
    e.preventDefault(); e.stopPropagation();
    wrap.classList.toggle('drag-over', type === 'dragenter' || type === 'dragover');
    if (type === 'drop') handleFile(e.dataTransfer.files[0]);
  }));

  ratioSelect.onchange = () => {
    const v = ratioSelect.value, [rw, rh] = v.split('/').map(Number);
    const src = drawingReference || cloneCanvas(drawCanvas);
    setRatio(v);
    const w = Math.max(1, Math.round(Math.min(MAX_WIDTH[v], wrap.parentElement.clientWidth)));
    restoreToken++;
    resizeCanvases(w, Math.max(1, Math.round(w * rh / rw)));
    renderBackground();
    ctx.drawImage(src, ...fitBox(src.width, src.height, drawCanvas.width, drawCanvas.height));
    renderText(w);
    saveHistory(false);
  };

  /* ── 색상 ── */
  function hslToHex(h, s, l) {
    l /= 100;
    const a = s * Math.min(l, 1 - l) / 100;
    const f = n => {
      const k = (n + h / 30) % 12;
      return Math.round(255 * (l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1))).toString(16).padStart(2, '0');
    };
    return `#${f(0)}${f(8)}${f(4)}`;
  }
  function hexToHsl(hex) {
    const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    let h = 0;
    if (d) h = 60 * (max === r ? ((g - b) / d + 6) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4);
    return { h, l: (max + min) * 50 };
  }
  function applyColor(c) {
    color = T.color = c;
    curColor.style.background = c;
    renderText();
  }
  const updateColor = () => applyColor(hslToHex(hue, 100, lightness));
  const renderTrack = () => lightInput.style.background = `linear-gradient(to right, #000, hsl(${hue}, 100%, 50%), #fff)`;

  function remember(c) {
    recent = [c, ...recent.filter(x => x !== c)].slice(0, 5);
    historyEl.replaceChildren(...recent.map(c => {
      const d = document.createElement('div');
      d.style.backgroundColor = c;
      d.title = c;
      d.onclick = () => { ({ h: hue, l: lightness } = hexToHsl(c)); lightInput.value = Math.round(lightness); renderTrack(); applyColor(c); remember(c); };
      return d;
    }));
  }
  function pick(e) {
    const r = wheel.getBoundingClientRect();
    const x = e.clientX - r.left - r.width / 2, y = r.top + r.height / 2 - e.clientY;
    const dist = Math.hypot(x, y);
    if (dist <= 35 || dist > r.width / 2) return false;
    hue = (90 - Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    renderTrack();
    updateColor();
    return true;
  }
  wheel.addEventListener('mousedown', e => { if (pick(e)) drag = 'hue'; });
  lightInput.oninput = () => { lightness = +lightInput.value; updateColor(); };
  lightInput.onchange = () => remember(color);

  /* ── 텍스트 추가 ── */
  $('btnAddText').onclick = () => {
    Object.assign(T, { content: textInput.value || '텍스트를 입력하세요', size: +sizeInput.value, color, shown: true });
    selected = true;
    renderText();
    saveHistory(false);
  };
  sizeInput.oninput = () => { T.size = +sizeInput.value; renderText(); };
  sizeInput.onchange = () => saveHistory(false);
  textInput.oninput = () => { T.content = textInput.value; renderText(); };
  textInput.onchange = () => saveHistory(false);
  document.querySelectorAll('.font-item').forEach(b => {
    b.style.fontFamily = FONTS[b.dataset.font];
    b.onclick = () => { T.font = b.dataset.font; renderText(); saveHistory(false); };
  });

  const textPose = () => `${T.x}|${T.y}|${T.rot}`;
  text.addEventListener('mousedown', e => {
    if (mode) return;
    e.preventDefault();
    document.activeElement.blur();
    selected = true;
    drag = e.target === handle ? 'rotate' : 'text';
    const r = wrap.getBoundingClientRect();
    grab = { x: e.clientX - (r.left + T.x / 100 * r.width), y: e.clientY - (r.top + T.y / 100 * r.height), pose: textPose() };
    renderText();
  });
  document.addEventListener('mousedown', e => {
    if (selected && e.target.closest('.center-panel') && !text.contains(e.target)) { selected = false; renderText(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Delete' || !selected || !T.shown || e.target.closest('input, select, textarea')) return;
    Object.assign(T, { shown: false, x: 50, y: 50, rot: 0 });
    selected = false;
    renderText();
    saveHistory(false);
  });

  window.addEventListener('mousemove', e => {
    if (drag === 'hue') return pick(e);
    if (drag !== 'text' && drag !== 'rotate') return;
    const r = wrap.getBoundingClientRect();
    if (drag === 'text') {
      T.x = clamp((e.clientX - grab.x - r.left) / r.width * 100, 0, 100);
      T.y = clamp((e.clientY - grab.y - r.top) / r.height * 100, 0, 100);
    } else {
      const a = Math.atan2(e.clientY - (r.top + T.y / 100 * r.height), e.clientX - (r.left + T.x / 100 * r.width));
      T.rot = Math.round((a * 180 / Math.PI + 450) % 360);
    }
    renderText();
  });
  window.addEventListener('mouseup', () => {
    if (drag === 'hue') remember(color);
    if (isDrawing) saveHistory(true);
    else if ((drag === 'text' || drag === 'rotate') && textPose() !== grab.pose) saveHistory(false);
    drag = null;
    isDrawing = false;
  });

  /* ── 펜 / 지우개 ── */
  const MODES = { draw: ['btnDrawMode', '🖊️ 그리기 모드'], erase: ['btnEraserMode', '🧽 지우개 모드'] };
  function setMode(m) {
    mode = mode === m ? null : m;
    for (const [k, [id, name]] of Object.entries(MODES)) {
      $(id).textContent = `${name} ${mode === k ? '끄기' : '켜기'}`;
      $(id).classList.toggle('active', mode === k);
    }
    wrap.classList.toggle('drawing', !!mode);
  }
  $('btnDrawMode').onclick = () => setMode('draw');
  $('btnEraserMode').onclick = () => setMode('erase');
  document.querySelectorAll('[data-brush]').forEach(item => item.onclick = () => {
    document.querySelectorAll('[data-brush]').forEach(i => i.classList.toggle('active', i === item));
    brushType = item.dataset.brush;
  });
  brushSizeInput.oninput = () => $('brushSizeValue').textContent = brushSize = +brushSizeInput.value;
  eraserSizeInput.oninput = () => $('eraserSizeValue').textContent = eraserSize = +eraserSizeInput.value;

  function heart(size) {
    const t = size * .3;
    ctx.beginPath();
    ctx.moveTo(0, t);
    ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, t);
    ctx.bezierCurveTo(-size / 2, (size + t) / 2, 0, (size + t) / 1.2, 0, size);
    ctx.bezierCurveTo(0, (size + t) / 1.2, size / 2, (size + t) / 2, size / 2, t);
    ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, t);
    ctx.closePath();
    ctx.fill();
  }
  function star(outer, inner) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? inner : outer;
      ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawBrush(x, y, isStart) {
    const [x0, y0] = isStart ? [x, y] : [lastX, lastY];
    const line = (x1, y1) => { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); };
    ctx.save();
    ctx.lineCap = ctx.lineJoin = 'round';
    if (mode === 'erase') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.lineWidth = eraserSize;
      line(x, y);
    } else {
      ctx.strokeStyle = ctx.fillStyle = color;
      if (brushType === 'pen') {
        ctx.lineWidth = brushSize;
        line(x, y);
      } else if (brushType === 'pencil') {
        ctx.globalAlpha = .7;
        ctx.lineWidth = brushSize + 2;
        line(x + (Math.random() - .5) * 4, y + (Math.random() - .5) * 4);
        ctx.globalAlpha = .4;
        ctx.beginPath();
        ctx.arc(x + (Math.random() - .5) * 10, y + (Math.random() - .5) * 10, brushSize / 2, 0, TAU);
        ctx.fill();
      } else if (brushType === 'neon') {
        // 1. 네온 빛(그림자) 긋기
        ctx.strokeStyle = color;
        ctx.shadowBlur = 15;
        ctx.shadowColor = color;
        ctx.lineWidth = brushSize + 2;
        line(x, y);
        
        // 2. 그림자 없애고, 그 위에 하얀색 코어 선 덧그리기
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = brushSize * 0.4;
        line(x, y);
      } else if (isStart || Math.hypot(x - stampX, y - stampY) > 25) {
        stampX = x; stampY = y;
        ctx.translate(x, y);
        ctx.rotate(Math.random() * TAU);
        brushType === 'heart' ? heart(brushSize * 3) : star(brushSize * 3, brushSize * 1.5);
      }
    }
    ctx.restore();
  }
  const mousePos = e => {
    const r = drawCanvas.getBoundingClientRect();
    return [(e.clientX - r.left) * drawCanvas.width / r.width, (e.clientY - r.top) * drawCanvas.height / r.height];
  };
  drawCanvas.addEventListener('mousedown', e => {
    if (!mode) return;
    isDrawing = true;
    [lastX, lastY] = mousePos(e);
    drawBrush(lastX, lastY, true);
  });
  drawCanvas.addEventListener('mousemove', e => {
    if (!isDrawing) return;
    const [x, y] = mousePos(e);
    drawBrush(x, y, false);
    lastX = x; lastY = y;
  });

  /* ── 완성본 및 다운로드 ── */
  function capture() {
    if (!baseImage) { alert('먼저 이미지를 불러와주세요!'); return null; }
    const c = Object.assign(document.createElement('canvas'), { width: drawCanvas.width, height: drawCanvas.height });
    const g = c.getContext('2d');
    g.drawImage(bgCanvas, 0, 0);
    g.drawImage(drawCanvas, 0, 0);
    if (T.shown) {
      const a = T.rot * Math.PI / 180;
      g.save();
      g.translate(T.x / 100 * c.width, T.y / 100 * c.height);
      g.rotate(a);
      Object.assign(g, {
        font: `bold ${T.size * c.width / 600}px ${FONTS[T.font]}`, fillStyle: T.color, textAlign: 'center', textBaseline: 'middle',
        shadowColor: 'rgba(0,0,0,0.8)', shadowBlur: 4, shadowOffsetX: 2 * (Math.cos(a) - Math.sin(a)), shadowOffsetY: 2 * (Math.sin(a) + Math.cos(a)),
      });
      g.fillText(T.content, 0, 0);
      g.restore();
    }
    return c;
  }

  function drawFeed(card) {
    const W = 400, HEAD = 60, PIC = 400;
    const c = Object.assign(document.createElement('canvas'), { width: W, height: HEAD + PIC + 110 });
    const g = c.getContext('2d');
    g.fillStyle = '#fff';
    g.fillRect(0, 0, c.width, c.height);
    g.textAlign = 'left';
    g.textBaseline = 'middle';

    g.fillStyle = '#f0f0f0';
    g.beginPath(); g.arc(35, 30, 18, 0, TAU); g.fill();
    g.fillStyle = '#000';
    g.font = '16px Arial'; g.fillText('🦋', 27, 31);
    g.font = 'bold 14px "Pretendard", sans-serif'; g.fillText('ALEPH_Studio', 65, 31);
    g.fillStyle = '#eee'; g.fillRect(0, HEAD - 1, W, 1);

    const m = Math.min(card.width, card.height);
    g.drawImage(card, (card.width - m) / 2, (card.height - m) / 2, m, m, 0, HEAD, PIC, PIC);

    const y = HEAD + PIC;
    g.fillStyle = '#000'; g.font = '20px Arial';
    ['❤️', '💬', '✈️'].forEach((e, i) => g.fillText(e, 15 + i * 35, y + 25));
    g.font = 'bold 13px "Pretendard", sans-serif'; g.fillText('ALEPH_Studio', 15, y + 60);
    g.font = '13px "Pretendard", sans-serif'; g.fillStyle = '#333'; g.fillText('제가 만들었어요!', 105, y + 60);
    g.fillStyle = '#00376b'; g.fillText('#SKTagram #CardStudio', 15, y + 85);
    return c;
  }

  const save = (canvas, name) => Object.assign(document.createElement('a'), { href: canvas.toDataURL('image/png'), download: name }).click();
  let lastCard = null;
  $('btnDirectDownload').onclick = () => { const c = capture(); if (c) save(c, 'card_studio_image.png'); };
  $('btnComplete').onclick = () => {
    const c = capture();
    if (!c) return;
    lastCard = c;
    resultImg.src = c.toDataURL('image/png');
    modal.classList.add('show');
  };
  $('btnModalDownload').onclick = () => lastCard && save(drawFeed(lastCard), 'card_studio_instagram.png');
  $('btnCloseModal').onclick = () => modal.classList.remove('show');
  modal.onclick = e => { if (e.target === modal) modal.classList.remove('show'); };

  remember('#FFFFFF');
  renderTrack();
  updateColor();
</script>
</body>
</html>
