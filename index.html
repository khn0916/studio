<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>짤·카드 스튜디오 - Studio UI</title>
<style>
  :root { --bg-light: #f0f2f5; --panel-bg: #fff; --text-dark: #333; --border-color: #e0e0e0; --accent: #E1002A; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-light); color: var(--text-dark); font-family: 'Pretendard', sans-serif; }

  .center-panel, .canvas-wrapper, .upload-label, .insta-profile, .insta-main, .modal-overlay.show { display: flex; justify-content: center; align-items: center; }

  /* 상단 바 */
  .top-bar { height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; background: #fff; border-bottom: 1px solid var(--border-color); box-shadow: 0 2px 4px rgba(0,0,0,.02); }
  .top-bar h1 { margin: 0; font-size: 1.5rem; font-weight: 800; color: #111; }
  .top-actions { display: flex; gap: 10px; }
  .btn-outline { padding: 8px 20px; background: #fff; color: #333; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: .2s; }
  .btn-outline:hover { background: #f0f0f0; }
  .btn-complete { padding: 8px 20px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: .2s; }
  .btn-complete:hover { filter: brightness(1.1); }

  /* 메인 캔버스 */
  .main-container { display: flex; flex: 1; overflow: hidden; }
  .center-panel { flex: 1; padding: 30px; background: #e9ecef; }
  
  .canvas-wrapper { 
    position: relative; 
    width: 100%; 
    max-width: 600px; 
    aspect-ratio: 1 / 1; 
    background: #fff; 
    border: 2px dashed #b0b0b0; 
    border-radius: 12px; 
    overflow: hidden; 
    transition: .3s; 
    box-shadow: 0 4px 12px rgba(0,0,0,.05); 
  }
  .canvas-wrapper.drag-over { border-color: var(--accent); background: rgba(225,0,42,.05); }
  
  .canvas-top-bar {
    position: absolute; top: 10px; left: 10px; right: 10px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 20; pointer-events: none; 
  }
  .canvas-top-left, .canvas-top-right { display: flex; gap: 8px; pointer-events: auto; }
  
  .icon-btn {
    background: rgba(255,255,255,0.9); border: 1px solid #ddd; border-radius: 6px;
    padding: 6px 12px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 5px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1); font-weight: bold; color: #333;
  }
  .icon-btn:hover { background: #fff; }
  
  .ratio-select {
    background: rgba(255,255,255,0.9); border: 1px solid #ddd; border-radius: 6px;
    padding: 6px; font-size: 0.9rem; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); font-weight: bold; color: #333;
  }

  .upload-label { position: absolute; inset: 0; cursor: pointer; z-index: 5; }
  .upload-guide { text-align: center; color: #999; pointer-events: none; }
  .upload-guide svg { width: 50px; height: 50px; margin-bottom: 10px; fill: #ccc; }
  
  #mainImage { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: none; z-index: 1; }
  
  .text-layer { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; padding: 5px; z-index: 10; color: #fff; font-size: 40px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,.8); white-space: nowrap; cursor: move; user-select: none; }
  .text-layer.active { outline: 2px dashed #333; }

  /* 오른쪽 패널 */
  .right-panel { width: 280px; display: flex; flex-direction: column; overflow-y: auto; background: var(--panel-bg); border-left: 1px solid var(--border-color); }
  .color-section { padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; background: #f9f9f9; border-bottom: 2px solid var(--border-color); }
  .color-section .title { align-self: flex-start; display: flex; align-items: center; gap: 8px; font-size: .9rem; font-weight: bold; color: #555; }
  .swatch { width: 18px; height: 18px; border-radius: 4px; border: 2px solid #ccc; background: #f00; }
  .color-wheel-container { position: relative; width: 140px; height: 140px; border-radius: 50%; background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); cursor: crosshair; box-shadow: 0 0 10px rgba(0,0,0,.1); }
  .color-wheel-container::after { content: ''; position: absolute; top: 50%; left: 50%; width: 70px; height: 70px; transform: translate(-50%, -50%); border-radius: 50%; background: #f9f9f9; box-shadow: inset 0 0 5px rgba(0,0,0,.3), 0 0 0 2px #fff; pointer-events: none; }
  #lightnessInput { -webkit-appearance: none; appearance: none; width: 100%; height: 12px; margin: 0; border-radius: 6px; outline: none; cursor: pointer; }
  #lightnessInput::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 2px solid #888; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  #lightnessInput::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 2px solid #888; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .history-title { width: 100%; margin-top: 5px; font-size: .8rem; color: #888; }
  .history-palette { width: 100%; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .history-palette div { aspect-ratio: 1; border-radius: 50%; border: 1px solid #ddd; cursor: pointer; transition: transform .1s; }
  .history-palette div:hover { transform: scale(1.1); }

  /* 아코디언 도구 */
  .accordion { border-bottom: 1px solid var(--border-color); }
  .accordion-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: #fff; color: #333; font-weight: bold; cursor: pointer; user-select: none; }
  .accordion-header:hover { background: #f0f0f0; }
  .arrow { font-size: .8rem; color: #888; transition: transform .2s; }
  .accordion.open .arrow { transform: rotate(180deg); }
  .accordion-content { max-height: 0; padding: 0 15px; overflow: hidden; background: #fafafa; transition: max-height .3s ease-out; }
  .accordion.open .accordion-content { max-height: 300px; padding: 15px; overflow-y: auto; }
  .emoji-row { display: flex; gap: 10px; flex-wrap: wrap; font-size: 1.5rem; }
  .emoji-row span { cursor: pointer; }
  .tool-btn { width: 100%; padding: 10px; margin-bottom: 10px; background: #f0f0f0; color: #333; border: 1px solid #ddd; border-radius: 6px; text-align: left; cursor: pointer; transition: .2s; }
  .tool-btn:hover { background: #e0e0e0; }
  .tool-btn.primary { background: var(--accent); color: #fff; text-align: center; }
  .input-group { margin-bottom: 15px; }
  .input-group label { display: block; margin-bottom: 5px; font-size: .9rem; color: #666; }
  .input-group input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; background: #fff; color: #333; border: 1px solid #ccc; border-radius: 4px; }
  .input-group input[type="range"] { width: 100%; }

  /* 인스타 피드 모달 */
  .modal-overlay { position: fixed; inset: 0; display: none; z-index: 1000; background: rgba(0,0,0,.6); backdrop-filter: blur(3px); }
  .insta-modal { width: 400px; background: #fff; color: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.3); animation: slideUp .3s ease-out; display: flex; flex-direction: column; }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .insta-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #eee; }
  .insta-profile { width: 36px; height: 36px; border-radius: 50%; background: #ddd; font-size: 1.2rem; }
  .insta-nick { font-weight: bold; font-size: .95rem; }
  
  /* 1:1 비율 강제 수정 */
  .insta-main { width: 100%; aspect-ratio: 1 / 1; background: #000; overflow: hidden; }
  .insta-main img { width: 100%; height: 100%; object-fit: cover; display: block; }
  
  .insta-footer { padding: 12px 16px; }
  .insta-info { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 8px; }
  .insta-actions { display: flex; gap: 15px; font-size: 1.5rem; margin-bottom: 8px; }
  .insta-caption { font-size: .9rem; line-height: 1.4; }
  .insta-caption span { color: #00376b; }
  
  .btn-insta-download { padding: 8px 12px; background: #00376b; color: white; border: none; border-radius: 6px; font-size: 0.85rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; }
  
  .close-modal { position: absolute; top: 20px; right: 20px; background: none; border: none; color: #fff; font-size: 2rem; cursor: pointer; }
</style>
</head>
<body>

  <div class="top-bar">
    <h1>Card Studio</h1>
    <div class="top-actions">
      <button class="btn-outline" id="btnDirectDownload">바로 다운로드💾</button>
      <button class="btn-complete" id="btnComplete">업로드하기</button>
    </div>
  </div>

  <div class="main-container">
    <div class="center-panel">
      <div class="canvas-wrapper" id="canvasWrapper">
        
        <div class="canvas-top-bar">
          <div class="canvas-top-left">
            <button class="icon-btn" id="btnUploadIcon" title="사진 가져오기">📁</button>
            <select class="ratio-select" id="ratioSelect">
              <option value="1/1">1:1</option>
              <option value="4/5">4:5</option>
              <option value="9/16">9:16</option>
            </select>
          </div>
          <div class="canvas-top-right">
            <button class="icon-btn" id="btnDeleteImg" style="display: none;">❌ 사진삭제</button>
          </div>
        </div>

        <label class="upload-label" for="fileInput" id="uploadLabel">
          <div class="upload-guide">
            <svg viewBox="0 0 24 24"><path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" /></svg>
            <p>이미지를 드래그하거나<br>클릭해서 불러오세요.</p>
          </div>
        </label>
        <input type="file" id="fileInput" accept="image/png, image/jpeg" hidden>
        <img id="mainImage" alt="메인 이미지">
        <div class="text-layer" id="textLayer">텍스트를 입력하세요</div>
      </div>
    </div>

    <div class="right-panel">
      <div class="color-section">
        <div class="title">색상 <span class="swatch" id="currentColor"></span></div>
        <div class="color-wheel-container" id="colorWheel"></div>
        <div class="history-title">밝기</div>
        <input type="range" id="lightnessInput" min="0" max="100" value="50">
        <div class="history-title">사용기록</div>
        <div class="history-palette" id="historyPalette"></div>
      </div>

      <div class="accordion">
        <div class="accordion-header"><span>🖊️ 펜 (그리기)</span><span class="arrow">▼</span></div>
        <div class="accordion-content">
          <button class="tool-btn" data-soon="펜 기능은 다음 업데이트에!">자유 곡선</button>
          <button class="tool-btn" data-soon="펜 기능은 다음 업데이트에!">직선</button>
        </div>
      </div>

      <div class="accordion">
        <div class="accordion-header"><span>😊 이모지</span><span class="arrow">▼</span></div>
        <div class="accordion-content">
          <div class="emoji-row">
            <span data-soon="이모지 기능 준비 중!">😈</span><span data-soon="이모지 기능 준비 중!">🤺</span>
            <span data-soon="이모지 기능 준비 중!">🔥</span><span data-soon="이모지 기능 준비 중!">💖</span>
          </div>
        </div>
      </div>

      <div class="accordion open">
        <div class="accordion-header"><span>🔤 텍스트 추가</span><span class="arrow">▼</span></div>
        <div class="accordion-content">
          <div class="input-group"><label>내용</label><input type="text" id="textInput" placeholder="문구 입력" value="텍스트를 입력하세요"></div>
          <div class="input-group"><label>크기</label><input type="range" id="sizeInput" min="10" max="100" value="40"></div>
          <button class="tool-btn primary" id="btnAddText">텍스트 얹기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 인스타 피드 모달 -->
  <div class="modal-overlay" id="modal">
    <button class="close-modal" id="btnCloseModal">×</button>
    <div class="insta-modal">
      <div class="insta-header"><div class="insta-profile">🦋</div><div class="insta-nick">ALEPH_Studio</div></div>
      <!-- 1:1 비율 강제 -->
      <div class="insta-main"><img id="instaResultImg" alt="완성된 짤"></div>
      
      <div class="insta-footer">
        <div class="insta-actions">❤️ 💬 ✈️</div>
        <div class="insta-info">
          <div class="insta-caption"><b>ALEPH_Studio</b> 제가 만들었어요!<br><span>#SKTagram #CardStudio</span></div>
          <button class="btn-insta-download" id="btnModalDownload">💾 다운로드</button>
        </div>
      </div>
    </div>
  </div>

<script>
  const $ = id => document.getElementById(id);
  const [wrap, img, label, text, curColor, historyEl, fileInput, wheel, lightInput, textInput, sizeInput, modal, resultImg] =
    ['canvasWrapper', 'mainImage', 'uploadLabel', 'textLayer', 'currentColor', 'historyPalette', 'fileInput', 'colorWheel',
     'lightnessInput', 'textInput', 'sizeInput', 'modal', 'instaResultImg'].map($);
  
  const btnUploadIcon = $('btnUploadIcon');
  const ratioSelect = $('ratioSelect');
  const btnDeleteImg = $('btnDeleteImg');
  const btnDirectDownload = $('btnDirectDownload');
  const btnModalDownload = $('btnModalDownload');

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  let hue = 0, lightness = 50, color;                       
  let recent = ['#FFFFFF', '#000000', '#E1002A', '#004488', '#FF7A00'];
  let drag = null, grab = null;                             
  let textX = 50, textY = 50;                               

  document.querySelectorAll('.accordion-header').forEach(h => h.onclick = () => h.parentElement.classList.toggle('open'));
  document.querySelectorAll('[data-soon]').forEach(el => el.onclick = () => alert(el.dataset.soon));

  /* ── 이미지 업로드 / 삭제 ── */
  function handleFile(file) {
    if (!['image/png', 'image/jpeg'].includes(file.type)) return alert('지원하지 않는 파일 형식입니다. PNG 또는 JPEG 파일만 사용 가능합니다.');
    if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
    img.src = URL.createObjectURL(file);
    img.style.display = 'block';
    label.style.display = 'none';
    btnDeleteImg.style.display = 'flex';
  }
  
  btnUploadIcon.onclick = () => fileInput.click();

  btnDeleteImg.onclick = () => {
    if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
    img.src = '';
    img.style.display = 'none';
    label.style.display = 'flex';
    btnDeleteImg.style.display = 'none';
  };

  ratioSelect.onchange = (e) => {
    const val = e.target.value;
    wrap.style.aspectRatio = val;
    if (val === '9/16') {
      wrap.style.maxWidth = '340px'; 
    } else if (val === '4/5') {
      wrap.style.maxWidth = '480px';
    } else {
      wrap.style.maxWidth = '600px';
    }
  };

  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(type => wrap.addEventListener(type, e => {
    e.preventDefault();
    e.stopPropagation();
    wrap.classList.toggle('drag-over', type === 'dragenter' || type === 'dragover');
    if (type === 'drop' && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  }));
  fileInput.onchange = e => e.target.files[0] && handleFile(e.target.files[0]);

  /* ── 색상 변환 ── */
  function hslToHex(h, s, l) {
    l /= 100;
    const a = s * Math.min(l, 1 - l) / 100;
    const f = n => {
      const k = (n + h / 30) % 12;
      return Math.round(255 * (l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1))).toString(16).padStart(2, '0');
    };
    return `#${f(0)}${f(8)}${f(4)}`;
  }
  function hexToHsl(hex) {
    const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    let h = 0;
    if (d) h = 60 * (max === r ? ((g - b) / d + 6) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4);
    return { h, l: (max + min) * 50 };
  }

  function applyColor(c) {
    color = c;
    curColor.style.background = text.style.color = c;
  }
  const updateColor = () => applyColor(hslToHex(hue, 100, lightness));
  const renderTrack = () => lightInput.style.background = `linear-gradient(to right, #000, hsl(${hue}, 100%, 50%), #fff)`; 

  function remember(c) {                                    
    recent = [c, ...recent.filter(x => x !== c)].slice(0, 5);
    historyEl.replaceChildren(...recent.map(c => {
      const d = document.createElement('div');
      d.style.backgroundColor = c;
      d.title = c;
      d.onclick = () => { ({ h: hue, l: lightness } = hexToHsl(c)); lightInput.value = Math.round(lightness); renderTrack(); applyColor(c); remember(c); };
      return d;
    }));
  }

  function pick(e) {
    const r = wheel.getBoundingClientRect();
    const x = e.clientX - r.left - r.width / 2, y = r.top + r.height / 2 - e.clientY;
    const dist = Math.hypot(x, y);
    if (dist <= 35 || dist > r.width / 2) return false;                                  
    hue = (90 - Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    renderTrack();
    updateColor();
    return true;
  }
  wheel.addEventListener('mousedown', e => { if (pick(e)) drag = 'hue'; });
  lightInput.oninput = () => { lightness = +lightInput.value; updateColor(); };
  lightInput.onchange = () => remember(color);              

  /* ── 텍스트 ── */
  $('btnAddText').onclick = () => {
    text.textContent = textInput.value || '텍스트를 입력하세요';
    Object.assign(text.style, { fontSize: sizeInput.value + 'px', color, display: 'block' });
  };
  sizeInput.oninput = () => text.style.fontSize = sizeInput.value + 'px';
  textInput.oninput = () => text.textContent = textInput.value;

  text.addEventListener('mousedown', e => {
    e.preventDefault();
    drag = 'text';
    text.classList.add('active');
    const r = wrap.getBoundingClientRect();
    grab = { x: e.clientX - (r.left + textX / 100 * r.width), y: e.clientY - (r.top + textY / 100 * r.height) };
  });

  window.addEventListener('mousemove', e => {
    if (drag === 'text') {
      const r = wrap.getBoundingClientRect();
      textX = clamp((e.clientX - grab.x - r.left) / r.width * 100, 0, 100);
      textY = clamp((e.clientY - grab.y - r.top) / r.height * 100, 0, 100);
      text.style.left = textX + '%';
      text.style.top = textY + '%';
    } else if (drag) pick(e);
  });
  window.addEventListener('mouseup', () => {
    if (drag === 'hue') remember(color);                       
    drag = null;
    text.classList.remove('active');
  });

  /* ── 메인 캔버스 캡처 (사진만) ── */
  function captureMainImage() {
    if (!img.naturalWidth) return null;
    const c = document.createElement('canvas');
    c.width = wrap.clientWidth;
    c.height = wrap.clientHeight;
    const ctx = c.getContext('2d');

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, c.width, c.height);

    const s = Math.min(c.width / img.naturalWidth, c.height / img.naturalHeight);           
    const w = img.naturalWidth * s, h = img.naturalHeight * s;
    ctx.drawImage(img, (c.width - w) / 2, (c.height - h) / 2, w, h);

    if (text.style.display === 'block') {
      const cs = getComputedStyle(text);
      Object.assign(ctx, {
        font: `bold ${parseInt(cs.fontSize)}px 'Pretendard', sans-serif`, fillStyle: cs.color,
        textAlign: 'center', textBaseline: 'middle',
        shadowColor: 'rgba(0,0,0,0.8)', shadowBlur: 4, shadowOffsetX: 2, shadowOffsetY: 2,
      });
      ctx.fillText(text.textContent, textX / 100 * c.width, textY / 100 * c.height);
    }
    return c.toDataURL('image/png');
  }

  /* ── 인스타 피드 전체 캡처 ── */
  function captureInstaFeed(mainImageDataUrl) {
    return new Promise((resolve) => {
      const feedWidth = 400;
      const headerHeight = 60;
      const imageSize = 400; 
      const footerHeight = 110; 
      
      const c = document.createElement('canvas');
      c.width = feedWidth;
      c.height = headerHeight + imageSize + footerHeight;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, c.width, c.height);

      // 헤더
      ctx.fillStyle = '#f0f0f0';
      ctx.beginPath();
      ctx.arc(35, 30, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = '16px Arial';
      ctx.fillStyle = '#000';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText('🦋', 27, 31);
      ctx.font = 'bold 14px "Pretendard", sans-serif';
      ctx.fillText('ALEPH_Studio', 65, 31);
      
      ctx.strokeStyle = '#eee';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, headerHeight);
      ctx.lineTo(feedWidth, headerHeight);
      ctx.stroke();

      // 사진 (1:1 강제 크롭)
      const imgObj = new Image();
      imgObj.onload = () => {
        const imgRatio = imgObj.width / imgObj.height;
        let sx, sy, sWidth, sHeight;
        
        if (imgRatio > 1) {
          sHeight = imgObj.height;
          sWidth = imgObj.height;
          sx = (imgObj.width - sWidth) / 2;
          sy = 0;
        } else {
          sWidth = imgObj.width;
          sHeight = imgObj.width;
          sx = 0;
          sy = (imgObj.height - sHeight) / 2;
        }
        
        ctx.drawImage(imgObj, sx, sy, sWidth, sHeight, 0, headerHeight, imageSize, imageSize);

        // 하단 (아이콘 -> 캡션 순서)
        const footerY = headerHeight + imageSize;
        
        ctx.font = '20px Arial';
        ctx.fillStyle = '#000'; 
        ctx.fillText('❤️', 15, footerY + 25);
        ctx.fillText('💬', 50, footerY + 25);
        ctx.fillText('✈️', 85, footerY + 25);

        ctx.font = 'bold 13px "Pretendard", sans-serif';
        ctx.fillText('ALEPH_Studio', 15, footerY + 60);
        ctx.font = '13px "Pretendard", sans-serif';
        ctx.fillStyle = '#333';
        ctx.fillText('제가 만들었어요!', 105, footerY + 60);
        
        ctx.fillStyle = '#00376b';
        ctx.fillText('#SKTagram #CardStudio', 15, footerY + 85);

        resolve(c.toDataURL('image/png'));
      };
      imgObj.src = mainImageDataUrl;
    });
  }

  /* ── 버튼 이벤트 ── */
  btnDirectDownload.onclick = () => {
    const dataUrl = captureMainImage();
    if (dataUrl) {
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = 'card_studio_image.png';
      a.click();
    } else {
      alert('먼저 이미지를 불러와주세요!');
    }
  };

  $('btnComplete').onclick = () => {
    const dataUrl = captureMainImage();
    if (dataUrl) {
      resultImg.src = dataUrl;
      modal.classList.add('show');
    } else {
      alert('먼저 이미지를 불러와주세요!');
    }
  };

  btnModalDownload.onclick = async () => {
    if (!resultImg.src) return;
    const feedDataUrl = await captureInstaFeed(resultImg.src);
    const a = document.createElement('a');
    a.href = feedDataUrl;
    a.download = 'card_studio_instagram.png';
    a.click();
  };

  $('btnCloseModal').onclick = () => modal.classList.remove('show');
  modal.onclick = e => { if (e.target === modal) modal.classList.remove('show'); };

  remember('#FFFFFF');                                        
  renderTrack();
  updateColor();                                              
</script>
</body>
</html>
